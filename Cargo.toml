[package]
name = "orcatui"
version = "0.4.2"
edition = "2021"
description = "Terminal multi-agent coding orchestrator — TUI port of Orca GUI (stablyai/orca). Runs N coding agents side-by-side in split panes, monitored from one screen."
license = "MIT OR Apache-2.0"
authors = ["HeonJe LEE <lhjnano@gmail.com>"]
repository = "https://github.com/lhjnano/orcatui"
keywords = ["tui", "ratatui", "ai", "agent", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orcatui"
path = "src/main.rs"

[[bin]]
name = "orcatui-inject"
path = "src/bin/inject.rs"

[[bench]]
name = "orca"
harness = false

[dependencies]
# TUI rendering primitives — pinned to match ratatui-ppalla 0.0.3's requirements
# (ppalla 0.0.3 requires ratatui ^0.29 and crossterm ^0.28; pinning the exact
# majors avoids two-ratatui type conflicts if a future dep pulls a newer major).
ratatui = "0.29"
crossterm = "0.28"
ratatui-ppalla = "0.0.3"

# PTY management for spawning agent processes (wezterm's PTY layer)
portable-pty = "0.9"

# Terminal emulation: ANSI escape parsing + virtual terminal state -> Cell grid.
# NOTE: pinned to 0.15, NOT 0.16, due to a hard resolution conflict:
#   ratatui 0.29.0 (forced by ratatui-ppalla 0.0.3 -> ratatui ^0.29) exact-pins
#   unicode-width =0.2.0, while every vt100 0.16.x requires unicode-width ^0.2.1.
#   Those cannot coexist. vt100 0.15.x uses unicode-width ^0.1.x (a separate
#   major) which coexists cleanly. The vt100 API we depend on (Screen::process,
#   contents_diff, cell grid) is unchanged between 0.15 and 0.16. If a future
#   ratatui release relaxes the unicode-width pin, bump this to 0.16.
vt100 = "0.15"

# Async runtime for AgentBus (tokio MPSC, N->1) and timer-based frame scheduling
tokio = { version = "1", features = ["full"] }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling + config (de)serialization
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Orca daemon client discovery (standard config/data dir locations)
dirs = "5"

# WebSocket server for the mobile companion (Feature 10). Uses tokio (already
# present); no ratatui/crossterm overlap, so it coexists with the pinned stack.
tokio-tungstenite = "0.24"

# futures-util is a direct dependency because tokio-tungstenite exposes
# `WebSocketStream` as a `Sink`/`Stream` (from futures-core/futures-sink) but
# does NOT re-export the `SinkExt`/`StreamExt` extension traits needed to drive
# it (`.send()`, `.next()`). Those live only in futures-util, which Cargo does
# not let you name unless it is a direct dep (transitive deps are not
# addressable). Already resolved transitively at 0.3.x via tokio-tungstenite,
# so pinning it adds no new version to the graph and disturbs nothing above.
futures-util = "0.3"

# Base64 encoding for the daemon protocol (PTY output in NDJSON messages).
base64 = "0.22"

[dev-dependencies]
# Benchmarking only — `cargo bench --bench orca`. `default-features = false`
# drops the unused `rayon` (parallel sample analysis) to keep the dep graph
# lean; `plotters` keeps the HTML reports under `target/criterion/`, and
# `cargo_bench_support` keeps the `cargo bench` entry point. Resolves cleanly
# alongside the pinned ratatui 0.29 / crossterm 0.28 / tokio 1 stack — criterion
# 0.5 shares no overlapping deps at incompatible versions.
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

# Optimize the release binary for the 60 fps budget: full LTO + single
# codegen unit squeezes every cycle out of the render/parse hot paths,
# and `strip` shrinks the binary (~40% smaller).
[profile.release]
lto = true
codegen-units = 1
strip = true
