[program:orcatui]
command=%(here)s/orcatui daemon
directory=%(ENV_HOME)s
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
user=%(ENV_USER)s
environment=HOME="%(ENV_HOME)s",XDG_RUNTIME_DIR="/run/user/%(ENV_UID)s"
stdout_logfile=%(ENV_HOME)s/.local/share/orcatui/daemon.log
stderr_logfile=%(ENV_HOME)s/.local/share/orcatui/daemon.err
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
